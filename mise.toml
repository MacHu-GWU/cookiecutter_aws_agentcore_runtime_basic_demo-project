# See claude code environment variables documents at https://code.claude.com/docs/en/settings
[env]
# A secret that cannot be read becomes an empty string, so mise still loads and tasks report it as not set.
GITHUB_TOKEN = "{{ exec(command='uvx --from home-secret-toml hst get github.accounts.sh.users.sh.secrets.dev.value || true') }}"
CODECOV_TOKEN = "{{ exec(command='uvx --from home-secret-toml hst get codecov_io.accounts.sh.users.sh.secrets.dev.value || true') }}"
READTHEDOCS_TOKEN = "{{ exec(command='uvx --from home-secret-toml hst get readthedocs.accounts.sh.users.sh.secrets.dev.value || true') }}"
# Make uv use the mise Python below (first ``python`` on PATH), not a uv-managed one
# or a global ``~/.config/uv/.python-version`` pin. ``[tools] python`` is the one dev version.
UV_PYTHON = "python"
# Local, per-person settings; copy .env.example to .env (git-ignored) and fill in:
# - ENV_NAME: the current environment (dev, tst, prd) of one.config / one.bsm; default dev.
# - AWS_PROFILE_FOR_DEV, AWS_PROFILE_FOR_TST, AWS_PROFILE_FOR_PRD: the AWS CLI profile of
#   each environment; the generated cdk-plan/up/down-<env>-* tasks pass it as --profile.
_.file = ".env"

[tools]
python = "3.12" # the dev Python; .readthedocs.yml reads it from here
uv = "latest"
claude = "latest"
pandoc = "3.9" # Use pandoc 3.9 - latest stable major version as of 2026-04
node = "24" # runtime of the cdk CLI and of aws-cdk-lib (jsii)
awscli = "2.34.24"
"npm:aws-cdk" = "2.1145.0" # the cdk CLI; must be new enough for the aws-cdk-lib in uv.lock
"npm:@aws/agentcore" = "1.0.1" # the AgentCore CLI; deploys the agentcore/ project (Runtimes)

# === Tasks ===
# Python Environment Management
[tasks.venv-create]
description = "🐍 Create Python virtual environment using uv (creates .venv directory)"
run = "uv venv --allow-existing"

[tasks.venv-remove]
description = "🗑️ Remove Python virtual environment (deletes .venv directory)"
run = "rm -r .venv"

# Dependency Management
[tasks.inst]
description = "💾 Install all Python dependencies using uv (syncs from pyproject.toml and uv.lock)"
depends = ["venv-create"]
run = "uv sync --all-extras --all-groups"

[tasks.export]
description = "📋 Export Python dependencies to requirements*.txt files using uv (for legacy compatibility)"
run = """
uv export --format requirements-txt --no-dev --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements.txt
uv export --format requirements-txt --extra dev --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-dev.txt
uv export --format requirements-txt --extra test --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-test.txt
uv export --format requirements-txt --extra doc --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-doc.txt
uv export --format requirements-txt --extra mise --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-mise.txt
"""

# Testing
[tasks.test]
description = "🧪 Run unit tests using pytest (scans test files automatically)"
run = ".venv/bin/pytest tests"
depends = ["inst"]

[tasks.cov]
description = "🧪📊 Run unit tests with code coverage using pytest (generates HTML report in htmlcov/)"
run = ".venv/bin/pytest tests -s --tb=native --cov=cookiecutter_aws_agentcore_runtime_basic_demo --cov-report term-missing --cov-report html:htmlcov"
depends = ["inst"]

[tasks.int-test]
description = "🧪☁️ Run integration tests against the stacks deployed in ENV_NAME (default dev), e.g. ENV_NAME=prd mise run int-test"
run = ".venv/bin/pytest tests_int -s --tb=native"
depends = ["inst"]

[tasks.view-cov]
description = "👀📊 Open code coverage HTML report in browser (requires 'cov' task to run first)"
run = "open htmlcov/index.html"

# Code Quality
[tasks.format]
description = "🎨 Format all Python code with ruff (package, tests, CDK app, mise task scripts, skill scripts)"
run = "uvx ruff format cookiecutter_aws_agentcore_runtime_basic_demo tests tests_int cdk .mise/tasks .claude/skills/pywf-oss-base .claude/skills/aws-agentcore-base"

[tasks.lint]
description = "🔍 Lint Python code with ruff (unused/undefined names) and check one imported name per statement"
run = """
uvx ruff check --select F401,F821,F841 cookiecutter_aws_agentcore_runtime_basic_demo tests tests_int cdk .mise/tasks .claude/skills/pywf-oss-base .claude/skills/aws-agentcore-base
python3 .claude/skills/pywf-oss-base/scripts/check_one_import_per_line.py --paths cookiecutter_aws_agentcore_runtime_basic_demo tests tests_int cdk .mise/tasks .claude/skills/pywf-oss-base .claude/skills/aws-agentcore-base
"""

# AgentCore, local (no AWS). The per-runtime tasks ac-local-<slug>, ac-dev-<slug>, and
# ac-local-<slug>-call are generated (gen-env-tasks), with each runtime's local port.
[tasks.free-port]
description = "🧹 Stop this repo's leftover server on a port: mise run free-port --port <port> (never stops a process outside this repo)"
run = ".venv/bin/python .mise/tasks/free-port.py"

# AgentCore CLI project (agentcore/); every task deploys or builds ALL runtimes of the project
[tasks.ac-gen]
description = "🏗️ Generate agentcore/agentcore.json, agentcore/aws-targets.json (for ENV_NAME, default dev), and app/<Runtime>/ from the config, uv.lock, and the package"
run = ".venv/bin/python .mise/tasks/ac-gen.py"
depends = ["inst"]

[tasks.ac-check-wheels]
description = "🏗️ Check every runtime's dependencies install as agentcore deploy installs them: wheels only, Linux aarch64 (dry run, no AWS call)"
run = ".venv/bin/python .mise/tasks/ac-check-wheels.py"
depends = ["ac-gen"]

[tasks.ac-build]
description = "🏗️ Build every runtime's CodeZip and synth the AgentCore stack of each target (no AWS calls)"
run = "agentcore build"
depends = ["ac-gen"]

[tasks.ac-check-layout]
description = "🔎 Compare agentcore/cdk/ with a fresh `agentcore create` of the installed AgentCore CLI (run after upgrading the CLI; no AWS call)"
run = ".venv/bin/python .claude/skills/aws-agentcore-base/scripts/check_cdk_layout.py"

# Documentation
[tasks.build-doc]
description = "📚 Build Sphinx documentation using sphinx-build (generates HTML in docs/build/html/)"
depends = ["inst"]
run = """
rm -rf docs/build
.venv/bin/sphinx-build -b html docs/source docs/build/html
"""

[tasks.view-doc]
description = "👀📚 Open built Sphinx documentation in browser (requires 'build-doc' task to run first)"
run = "open docs/build/html/index.html"

[tasks.notebook-to-markdown]
description = "📓 Convert Jupyter notebooks to Markdown for AI knowledge base (processes .ipynb files)"
run = ".venv/bin/python .mise/tasks/notebook-to-markdown.py"
depends = ["inst"]

# Building & Release
[tasks.build]
description = "🏗️ Build Python package wheel and source distribution using uv (outputs to dist/)"
run = """
rm -rf dist
uv build
"""

[tasks.release]
description = "🏷 Create GitHub release using PyGithub (idempotent: skips if release exists)"
run = ".venv/bin/python .mise/tasks/release.py"
depends = ["inst"]

# CI/CD Setup
[tasks.setup-codecov]
description = "⚙️ Setup Codecov upload token on GitHub Actions secrets using PyGithub and httpx2"
run = ".venv/bin/python .mise/tasks/setup-codecov.py"
depends = ["inst"]

[tasks.setup-readthedocs]
description = "⚙️ Setup ReadTheDocs project and GitHub webhook using httpx2 API client"
run = ".venv/bin/python .mise/tasks/setup-readthedocs.py"
depends = ["inst"]

[tasks.update-github-metadata]
description = "🔧 Update GitHub repository description and homepage using PyGithub"
run = ".venv/bin/python .mise/tasks/update-github-metadata.py"
depends = ["inst"]

# Per-environment tasks (config, AgentCore deploy, CDK)
[tasks.gen-env-tasks]
description = "🧩 Regenerate the config-<deploy|delete>-<env|all>, ac-deploy-<env>, cdk-<action>-<env>-<stack>-stack / -all tasks below from StackCtxEnum and EnvNameEnum (rewrites the <env-tasks> block)"
run = ".venv/bin/python .mise/tasks/gen-env-tasks.py"
depends = ["inst"]

[tasks.gen-quick-links]
description = "🔗 Regenerate QUICK_LINKS.md, the console of every AWS resource in every environment: stacks and config from config/, runtimes, their roles and logs looked up in AWS (read only) with each environment's profile"
run = ".venv/bin/python .mise/tasks/gen-quick-links.py"
depends = ["inst"]

[tasks.print-cdk-stack-urls]
description = "🔗 Print the CloudFormation console URL of every stack in every environment (no AWS call; a failing environment prints an error, the rest still print)"
run = ".venv/bin/python .mise/tasks/print-cdk-stack-urls.py"
depends = ["inst"]

# <env-tasks>
# Generated by `mise run gen-env-tasks`. Do not edit by hand.

[tasks."config-deploy-dev"]
description = "⚙️ Deploy the config of dev to SSM Parameter Store, if it changed (writes to AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> config-deploy-dev: Deploy the config of dev to SSM Parameter Store, if it changed (writes to AWS)'
.venv/bin/python .mise/tasks/config-deploy.py
"""

[tasks."config-delete-dev"]
description = "🗑️ Delete the config of dev from SSM Parameter Store (writes to AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> config-delete-dev: Delete the config of dev from SSM Parameter Store (writes to AWS)'
.venv/bin/python .mise/tasks/confirm.py --action 'Delete the config parameter of dev?' --skip_var CONFIRM_YES --skip_var CONFIRMED_BY_CHAIN
.venv/bin/python .mise/tasks/config-delete.py
"""

[tasks."ac-deploy-dev"]
description = "🚀 Deploy every AgentCore runtime to the dev target: check that the agentcore-deps policy and the config exist, generate the project for dev, check the wheels, deploy (writes to AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-deploy-dev: Deploy every AgentCore runtime to the dev target: check that the agentcore-deps policy and the config exist, generate the project for dev, check the wheels, deploy (writes to AWS)'
echo '--- CloudFormation console ---'
echo 'AgentCore stack: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=AgentCore-AcRtDemo-dev&filteringStatus=active&viewNested=true'
.venv/bin/python .mise/tasks/ac-check-deps.py
.venv/bin/python .mise/tasks/ac-gen.py
.venv/bin/python .mise/tasks/ac-check-wheels.py
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore deploy --target dev'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore deploy --target dev
echo 'Commit agentcore/.cli/deployed-state.json if it changed: everyone who deploys shares it'
"""

[tasks."ac-down-dev"]
description = "🔴 Destroy every AgentCore runtime of the dev target: deploy an empty project with --yes, then generate the real one again, even if the deploy fails (writes to AWS; keeps the agentcore-deps stack and the config)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-down-dev: Destroy every AgentCore runtime of the dev target: deploy an empty project with --yes, then generate the real one again, even if the deploy fails (writes to AWS; keeps the agentcore-deps stack and the config)'
.venv/bin/python .mise/tasks/confirm.py --action 'Destroy every AgentCore runtime of dev?' --skip_var CONFIRM_YES --skip_var CONFIRMED_BY_CHAIN
echo '--- CloudFormation console ---'
echo 'AgentCore stack: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=AgentCore-AcRtDemo-dev&filteringStatus=active&viewNested=true'
.venv/bin/python .mise/tasks/ac-gen-teardown.py
trap '.venv/bin/python .mise/tasks/ac-gen.py' EXIT
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore deploy --target dev --yes'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore deploy --target dev --yes
echo 'Commit agentcore/.cli/deployed-state.json if it changed: everyone who deploys shares it'
"""

[tasks."ac-status-dev"]
description = "🔎 Show the deployed AgentCore runtimes of the dev target (reads AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-status-dev: Show the deployed AgentCore runtimes of the dev target (reads AWS)'
echo '--- CloudFormation console ---'
echo 'AgentCore stack: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=AgentCore-AcRtDemo-dev&filteringStatus=active&viewNested=true'
.venv/bin/python .mise/tasks/ac-gen.py
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore status --target dev'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore status --target dev
"""

[tasks."ac-invoke-dev-power-plant-mcp"]
description = "🤖 Invoke the deployed PowerPlantMcp of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-invoke-dev-power-plant-mcp: Invoke the deployed PowerPlantMcp of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)'
.venv/bin/python .mise/tasks/ac-gen.py
PAYLOAD='{"jsonrpc": "2.0", "id": 1, "method": "tools/call", "params": {"name": "get_site", "arguments": {"site_id": "S-03"}}}'
echo '--- Run command ---'
echo "AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore invoke --target dev --runtime PowerPlantMcp --mcp-method tools/call --mcp-name get_site --payload '$PAYLOAD' ${SESSION_ID:+--session-id $SESSION_ID}"
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore invoke --target dev --runtime PowerPlantMcp --mcp-method tools/call --mcp-name get_site --payload "$PAYLOAD" ${SESSION_ID:+--session-id $SESSION_ID}
"""

[tasks."ac-invoke-dev-site-agent"]
description = "🤖 Invoke the deployed SiteAgent of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-invoke-dev-site-agent: Invoke the deployed SiteAgent of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)'
.venv/bin/python .mise/tasks/ac-gen.py
PAYLOAD='{"prompt": "Can we send someone to inspect the turbines at site S-03 tomorrow? Who is assigned there?"}'
echo '--- Run command ---'
echo "AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore invoke --target dev --runtime SiteAgent --payload '$PAYLOAD' ${SESSION_ID:+--session-id $SESSION_ID}"
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore invoke --target dev --runtime SiteAgent --payload "$PAYLOAD" ${SESSION_ID:+--session-id $SESSION_ID}
"""

[tasks."ac-logs-dev-power-plant-mcp"]
description = "📜 Show the recent logs of the deployed PowerPlantMcp of dev; SINCE=2h looks further back (reads AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-logs-dev-power-plant-mcp: Show the recent logs of the deployed PowerPlantMcp of dev; SINCE=2h looks further back (reads AWS)'
.venv/bin/python .mise/tasks/ac-gen.py
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore logs runtime --name PowerPlantMcp --target dev --since ${SINCE:-30m}'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore logs runtime --name PowerPlantMcp --target dev --since ${SINCE:-30m}
"""

[tasks."ac-logs-dev-site-agent"]
description = "📜 Show the recent logs of the deployed SiteAgent of dev; SINCE=2h looks further back (reads AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-logs-dev-site-agent: Show the recent logs of the deployed SiteAgent of dev; SINCE=2h looks further back (reads AWS)'
.venv/bin/python .mise/tasks/ac-gen.py
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore logs runtime --name SiteAgent --target dev --since ${SINCE:-30m}'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore logs runtime --name SiteAgent --target dev --since ${SINCE:-30m}
"""

[tasks."ac-chain-up-dev"]
description = "🚀 Deploy everything AgentCore of dev: config-deploy-dev → cdk-up-dev-agentcore-deps-stack → ac-deploy-dev"
run = [
    "echo '=== ac-chain-up-dev: Deploy everything AgentCore of dev, in this order ==='",
    "echo '  1. config-deploy-dev: Deploy the config of dev to SSM Parameter Store, if it changed (writes to AWS)'",
    "echo '  2. cdk-up-dev-agentcore-deps-stack: Deploy stack agentcore-deps of dev (no approval prompt)'",
    "echo '  3. ac-deploy-dev: Deploy every AgentCore runtime to the dev target: check that the agentcore-deps policy and the config exist, generate the project for dev, check the wheels, deploy (writes to AWS)'",
    { task = "config-deploy-dev" },
    { task = "cdk-up-dev-agentcore-deps-stack" },
    { task = "ac-deploy-dev" },
    "echo '=== ac-chain-up-dev: done ==='",
]

[tasks."ac-chain-down-dev"]
description = "🔴 Destroy everything AgentCore of dev: ac-down-dev → cdk-down-dev-agentcore-deps-stack → config-delete-dev"
env = { CONFIRMED_BY_CHAIN = "true" }
run = [
    "echo '=== ac-chain-down-dev: Destroy everything AgentCore of dev, in this order ==='",
    "echo '  1. ac-down-dev: Destroy every AgentCore runtime of the dev target: deploy an empty project with --yes, then generate the real one again, even if the deploy fails (writes to AWS; keeps the agentcore-deps stack and the config)'",
    "echo '  2. cdk-down-dev-agentcore-deps-stack: Destroy stack agentcore-deps of dev (force, no confirmation)'",
    "echo '  3. config-delete-dev: Delete the config of dev from SSM Parameter Store (writes to AWS)'",
    ".venv/bin/python .mise/tasks/confirm.py --action 'Destroy the AgentCore runtimes, the agentcore-deps stack, and the config of dev?' --skip_var CONFIRM_YES",
    { task = "ac-down-dev" },
    { task = "cdk-down-dev-agentcore-deps-stack" },
    { task = "config-delete-dev" },
    "echo '=== ac-chain-down-dev: done ==='",
]

[tasks."ac-test-dev"]
description = "🧪 Test the deployed AgentCore runtimes of dev: ac-status-dev → ac-invoke-dev-power-plant-mcp → ac-invoke-dev-site-agent"
run = [
    "echo '=== ac-test-dev: Test the deployed AgentCore runtimes of dev, in this order ==='",
    "echo '  1. ac-status-dev: Show the deployed AgentCore runtimes of the dev target (reads AWS)'",
    "echo '  2. ac-invoke-dev-power-plant-mcp: Invoke the deployed PowerPlantMcp of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)'",
    "echo '  3. ac-invoke-dev-site-agent: Invoke the deployed SiteAgent of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)'",
    { task = "ac-status-dev" },
    { task = "ac-invoke-dev-power-plant-mcp" },
    { task = "ac-invoke-dev-site-agent" },
    "echo '=== ac-test-dev: done ==='",
]

[tasks."cdk-synth-dev-all"]
description = "⚪ Synthesize all stacks of dev to CloudFormation templates (no AWS call)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> cdk-synth-dev-all: Synthesize all stacks of dev to CloudFormation templates (no AWS call)'
echo '--- CloudFormation console ---'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-alerts: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-alerts&filteringStatus=active&viewNested=true'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-publisher: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-publisher&filteringStatus=active&viewNested=true'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-agentcore-deps: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-agentcore-deps&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk synth'
cdk synth
"""

[tasks."cdk-plan-dev-all"]
description = "🔵 Plan all stacks of dev: diff against what is deployed, through a CloudFormation change set (no deploy)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> cdk-plan-dev-all: Plan all stacks of dev: diff against what is deployed, through a CloudFormation change set (no deploy)'
echo '--- CloudFormation console ---'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-alerts: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-alerts&filteringStatus=active&viewNested=true'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-publisher: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-publisher&filteringStatus=active&viewNested=true'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-agentcore-deps: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-agentcore-deps&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk diff --all --method auto --profile {{env.AWS_PROFILE_FOR_DEV}}'
cdk diff --all --method auto --profile {{env.AWS_PROFILE_FOR_DEV}}
"""

[tasks."cdk-up-dev-all"]
description = "🟢 Deploy all stacks of dev (no approval prompt)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> cdk-up-dev-all: Deploy all stacks of dev (no approval prompt)'
echo '--- CloudFormation console ---'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-alerts: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-alerts&filteringStatus=active&viewNested=true'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-publisher: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-publisher&filteringStatus=active&viewNested=true'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-agentcore-deps: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-agentcore-deps&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk deploy --all --require-approval never --profile {{env.AWS_PROFILE_FOR_DEV}}'
cdk deploy --all --require-approval never --profile {{env.AWS_PROFILE_FOR_DEV}}
"""

[tasks."cdk-down-dev-all"]
description = "🔴 Destroy all stacks of dev (force, no confirmation)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
