run = ".venv/bin/python .mise/tasks/config-delete.py"

[tasks."ac-deploy-dev"]
description = "🚀 Deploy every AgentCore runtime to the dev target, after deploying the config (writes to AWS)"
depends = ["ac-gen", "config-deploy-dev"]
run = """
echo '--- CloudFormation console ---'
echo 'AgentCore stack: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=AgentCore-AcRtDemo-dev&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore deploy --target dev'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore deploy --target dev
"""

[tasks."cdk-synth-dev-all"]
description = "⚪ Synthesize all stacks of dev to CloudFormation templates (no AWS call)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '--- CloudFormation console ---'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-alerts: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-alerts&filteringStatus=active&viewNested=true'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-publisher: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-publisher&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk synth'
cdk synth
"""

[tasks."cdk-plan-dev-all"]
description = "🔵 Plan all stacks of dev: diff against what is deployed, through a CloudFormation change set (no deploy)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '--- CloudFormation console ---'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-alerts: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-alerts&filteringStatus=active&viewNested=true'
echo 'cookiecutter-aws-agentcore-runtime-basic-demo-dev-publisher: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-agentcore-runtime-basic-demo-dev-publisher&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk diff --all --method auto --profile {{env.AWS_PROFILE_FOR_DEV}}'
cdk diff --all --method auto --profile {{env.AWS_PROFILE_FOR_DEV}}
"""

[tasks."cdk-up-dev-all"]
description = "🟢 Deploy all stacks of dev (no approval prompt)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
