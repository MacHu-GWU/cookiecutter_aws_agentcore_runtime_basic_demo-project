[tasks."ac-chain-up-prd"]
description = "🚀 Deploy everything AgentCore of prd: config-deploy-prd → cdk-up-prd-agentcore-deps-stack → ac-deploy-prd"
run = [
    "echo '=== ac-chain-up-prd: Deploy everything AgentCore of prd, in this order ==='",
    "echo '  1. config-deploy-prd: Deploy the config of prd to SSM Parameter Store, if it changed (writes to AWS)'",
    "echo '  2. cdk-up-prd-agentcore-deps-stack: Deploy stack agentcore-deps of prd (no approval prompt)'",
    "echo '  3. ac-deploy-prd: Deploy every AgentCore runtime to the prd target: check that the agentcore-deps policy and the config exist, generate the project for prd, check the wheels, deploy (writes to AWS)'",
    { task = "config-deploy-prd" },
    { task = "cdk-up-prd-agentcore-deps-stack" },
    { task = "ac-deploy-prd" },
    "echo '=== ac-chain-up-prd: done ==='",
]

[tasks."ac-chain-down-prd"]
description = "🔴 Destroy everything AgentCore of prd: ac-down-prd → cdk-down-prd-agentcore-deps-stack → config-delete-prd"
env = { CONFIRMED_BY_CHAIN = "true" }
run = [
    "echo '=== ac-chain-down-prd: Destroy everything AgentCore of prd, in this order ==='",
    "echo '  1. ac-down-prd: Destroy every AgentCore runtime of the prd target: deploy an empty project with --yes, then generate the real one again, even if the deploy fails (writes to AWS; keeps the agentcore-deps stack and the config)'",
    "echo '  2. cdk-down-prd-agentcore-deps-stack: Destroy stack agentcore-deps of prd (force, no confirmation)'",
    "echo '  3. config-delete-prd: Delete the config of prd from SSM Parameter Store (writes to AWS)'",
    ".venv/bin/python .mise/tasks/confirm.py --action 'Destroy the AgentCore runtimes, the agentcore-deps stack, and the config of prd?' --skip_var CONFIRM_YES",
    { task = "ac-down-prd" },
    { task = "cdk-down-prd-agentcore-deps-stack" },
    { task = "config-delete-prd" },
    "echo '=== ac-chain-down-prd: done ==='",
]

