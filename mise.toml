echo '--- Run command ---'
echo 'cdk deploy --all --require-approval never --profile {{env.AWS_PROFILE_FOR_DEV}}'
cdk deploy --all --require-approval never --profile {{env.AWS_PROFILE_FOR_DEV}}
"""

