# See claude code environment variables documents at https://code.claude.com/docs/en/settings
[env]
# A secret that cannot be read becomes an empty string, so mise still loads and tasks report it as not set.
GITHUB_TOKEN = "{{ exec(command='uvx --from home-secret-toml hst get github.accounts.sh.users.sh.secrets.dev.value || true') }}"
CODECOV_TOKEN = "{{ exec(command='uvx --from home-secret-toml hst get codecov_io.accounts.sh.users.sh.secrets.dev.value || true') }}"
READTHEDOCS_TOKEN = "{{ exec(command='uvx --from home-secret-toml hst get readthedocs.accounts.sh.users.sh.secrets.dev.value || true') }}"
# Make uv use the mise Python below (first ``python`` on PATH), not a uv-managed one
# or a global ``~/.config/uv/.python-version`` pin. ``[tools] python`` is the one dev version.
UV_PYTHON = "python"
# Ports of the local servers (ac-local-*, ac-dev-*). They are unusual on purpose, so
# whatever listens there is almost surely a leftover server of ours; each server task
# first runs .mise/tasks/free-port.py, which stops only processes running in this repo.
# Deployed runtimes always listen on AgentCore's 8000 (MCP) and 8080 (HTTP).
LOCAL_MCP_PORT = "18731"
LOCAL_AGENT_PORT = "18732"
# Local, per-person settings; copy .env.example to .env (git-ignored) and fill in:
# - ENV_NAME: the current environment (dev, tst, prd) of one.config / one.bsm; default dev.
# - AWS_PROFILE_FOR_DEV, AWS_PROFILE_FOR_TST, AWS_PROFILE_FOR_PRD: the AWS CLI profile of
#   each environment; the generated cdk-plan/up/down-<env>-* tasks pass it as --profile.
_.file = ".env"

[tools]
python = "3.12" # the dev Python; .readthedocs.yml reads it from here
uv = "latest"
claude = "latest"
pandoc = "3.9" # Use pandoc 3.9 - latest stable major version as of 2026-04
node = "24" # runtime of the cdk CLI and of aws-cdk-lib (jsii)
awscli = "2.34.24"
"npm:aws-cdk" = "2.1145.0" # the cdk CLI; must be new enough for the aws-cdk-lib in uv.lock
"npm:@aws/agentcore" = "1.0.1" # the AgentCore CLI; deploys the agentcore/ project (Runtimes)

# === Tasks ===
# Python Environment Management
[tasks.venv-create]
description = "🐍 Create Python virtual environment using uv (creates .venv directory)"
run = "uv venv --allow-existing"

[tasks.venv-remove]
description = "🗑️ Remove Python virtual environment (deletes .venv directory)"
run = "rm -r .venv"

# Dependency Management
[tasks.inst]
description = "💾 Install all Python dependencies using uv (syncs from pyproject.toml and uv.lock)"
depends = ["venv-create"]
run = "uv sync --all-extras --all-groups"

[tasks.export]
description = "📋 Export Python dependencies to requirements*.txt files using uv (for legacy compatibility)"
run = """
uv export --format requirements-txt --no-dev --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements.txt
uv export --format requirements-txt --extra dev --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-dev.txt
uv export --format requirements-txt --extra test --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-test.txt
uv export --format requirements-txt --extra doc --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-doc.txt
uv export --format requirements-txt --extra mise --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-mise.txt
"""

# Testing
[tasks.test]
description = "🧪 Run unit tests using pytest (scans test files automatically)"
run = ".venv/bin/pytest tests"
depends = ["inst"]

[tasks.cov]
description = "🧪📊 Run unit tests with code coverage using pytest (generates HTML report in htmlcov/)"
run = ".venv/bin/pytest tests -s --tb=native --cov=cookiecutter_aws_agentcore_runtime_basic_demo --cov-report term-missing --cov-report html:htmlcov"
depends = ["inst"]

[tasks.int-test]
description = "🧪☁️ Run integration tests against the stacks deployed in ENV_NAME (default dev), e.g. ENV_NAME=prd mise run int-test"
run = ".venv/bin/pytest tests_int -s --tb=native"
depends = ["inst"]

[tasks.view-cov]
description = "👀📊 Open code coverage HTML report in browser (requires 'cov' task to run first)"
run = "open htmlcov/index.html"

# Code Quality
[tasks.format]
description = "🎨 Format all Python code with ruff (package, tests, CDK app, mise task scripts, pywf-oss skill scripts)"
run = "uvx ruff format cookiecutter_aws_agentcore_runtime_basic_demo tests tests_int cdk .mise/tasks .claude/skills/pywf-oss-base"

[tasks.lint]
description = "🔍 Lint Python code with ruff (unused/undefined names) and check one imported name per statement"
run = """
uvx ruff check --select F401,F821,F841 cookiecutter_aws_agentcore_runtime_basic_demo tests tests_int cdk .mise/tasks .claude/skills/pywf-oss-base
python3 .claude/skills/pywf-oss-base/scripts/check_one_import_per_line.py --paths cookiecutter_aws_agentcore_runtime_basic_demo tests tests_int cdk .mise/tasks .claude/skills/pywf-oss-base
"""

# AgentCore, local (no AWS)
[tasks.free-port]
description = "🧹 Stop this repo's leftover server on a port: mise run free-port --port <port> (never stops a process outside this repo)"
run = ".venv/bin/python .mise/tasks/free-port.py"

[tasks.ac-local-mcp]
description = "🔌 Run the PowerPlantMcp MCP server locally on http://localhost:$LOCAL_MCP_PORT/mcp (Ctrl+C to stop)"
run = [
    ".venv/bin/python .mise/tasks/free-port.py --port $LOCAL_MCP_PORT",
    "FASTMCP_PORT=$LOCAL_MCP_PORT .venv/bin/python -m cookiecutter_aws_agentcore_runtime_basic_demo.runtimes.power_plant_mcp",
]
depends = ["inst"]

[tasks.ac-local-mcp-call]
description = "🔌 Call the local PowerPlantMcp server (start it first with ac-local-mcp or ac-dev-mcp): list tools, get site S-03"
run = "MCP_URL=http://localhost:$LOCAL_MCP_PORT/mcp .venv/bin/python .mise/tasks/ac-local-mcp-call.py"

[tasks.ac-local-agent]
description = "🤖 Run the SiteAgent agent locally on http://localhost:$LOCAL_AGENT_PORT (needs ac-local-mcp running, and Bedrock access with the dev profile)"
run = [
    ".venv/bin/python .mise/tasks/free-port.py --port $LOCAL_AGENT_PORT",
    "AWS_PROFILE=$AWS_PROFILE_FOR_DEV AWS_REGION=us-east-1 MCP_URL=http://localhost:$LOCAL_MCP_PORT/mcp .venv/bin/python -m uvicorn cookiecutter_aws_agentcore_runtime_basic_demo.runtimes.site_agent:app --host 127.0.0.1 --port $LOCAL_AGENT_PORT",
]
depends = ["inst"]

[tasks.ac-local-agent-call]
description = "🤖 Ask the local SiteAgent the demo question (start the MCP server and the agent first, with ac-local-* or ac-dev-*)"
run = """
curl -s -X POST http://localhost:$LOCAL_AGENT_PORT/invocations -H 'Content-Type: application/json' \
  -d '{"prompt": "Can we send someone to inspect the turbines at site S-03 tomorrow? Who is assigned there?"}'
echo
"""

# AgentCore CLI project (agentcore/); every task deploys or builds ALL runtimes of the project
[tasks.ac-gen]
description = "🏗️ Generate agentcore/agentcore.json, agentcore/aws-targets.json, and app/<Runtime>/ from the config, uv.lock, and the package"
run = ".venv/bin/python .mise/tasks/ac-gen.py"
depends = ["inst"]

[tasks.ac-build]
description = "🏗️ Build every runtime's CodeZip and synth the AgentCore stack of each target (no AWS calls)"
run = "agentcore build"
depends = ["ac-gen"]

# An explicit --port: without it, agentcore dev silently moves to the next free port
# when the default one is taken, and the callers would reach the old server.
# The servers run as the agentcore_local runtime and read the config from SSM with the
# profile of ENV_NAME (agentcore/.env.local, written by ac-gen): run config-deploy-<env> first.
[tasks.ac-dev-mcp]
description = "🏗️ Run PowerPlantMcp from app/ with `agentcore dev` on :$LOCAL_MCP_PORT, as packaged, config from SSM (call it with ac-local-mcp-call)"
run = [
    ".venv/bin/python .mise/tasks/free-port.py --port $LOCAL_MCP_PORT",
    "AWS_REGION=us-east-1 agentcore dev --agent PowerPlantMcp --no-traces --port $LOCAL_MCP_PORT",
]
depends = ["ac-gen"]

[tasks.ac-dev-agent]
description = "🏗️ Run SiteAgent from app/ with `agentcore dev` on :$LOCAL_AGENT_PORT with the dev profile, config from SSM (needs ac-dev-mcp; call it with ac-local-agent-call)"
run = [
    ".venv/bin/python .mise/tasks/free-port.py --port $LOCAL_AGENT_PORT",
    "AWS_PROFILE=$AWS_PROFILE_FOR_DEV AWS_REGION=us-east-1 MCP_URL=http://localhost:$LOCAL_MCP_PORT/mcp agentcore dev --agent SiteAgent --no-traces --port $LOCAL_AGENT_PORT",
]
depends = ["ac-gen"]

[tasks.ac-invoke-dev-agent]
description = "🤖 Ask the deployed dev SiteAgent the demo question"
run = """
AWS_PROFILE=$AWS_PROFILE_FOR_DEV agentcore invoke --target dev --runtime SiteAgent \
  --payload '{"prompt": "Can we send someone to inspect the turbines at site S-03 tomorrow? Who is assigned there?"}'
"""

# Documentation
[tasks.build-doc]
description = "📚 Build Sphinx documentation using sphinx-build (generates HTML in docs/build/html/)"
depends = ["inst"]
run = """
rm -rf docs/build
.venv/bin/sphinx-build -b html docs/source docs/build/html
"""

[tasks.view-doc]
description = "👀📚 Open built Sphinx documentation in browser (requires 'build-doc' task to run first)"
run = "open docs/build/html/index.html"

[tasks.notebook-to-markdown]
description = "📓 Convert Jupyter notebooks to Markdown for AI knowledge base (processes .ipynb files)"
run = ".venv/bin/python .mise/tasks/notebook-to-markdown.py"
depends = ["inst"]

# Building & Release
[tasks.build]
description = "🏗️ Build Python package wheel and source distribution using uv (outputs to dist/)"
run = """
rm -rf dist
uv build
"""

[tasks.release]
description = "🏷 Create GitHub release using PyGithub (idempotent: skips if release exists)"
run = ".venv/bin/python .mise/tasks/release.py"
depends = ["inst"]

# CI/CD Setup
[tasks.setup-codecov]
description = "⚙️ Setup Codecov upload token on GitHub Actions secrets using PyGithub and httpx2"
