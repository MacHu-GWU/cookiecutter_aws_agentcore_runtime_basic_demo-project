.venv/bin/python .mise/tasks/ac-gen.py
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_PRD}} agentcore logs runtime --name SiteAgent --target prd --since ${SINCE:-30m}'
